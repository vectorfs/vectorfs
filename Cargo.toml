[workspace]
resolver = "3"
members = ["vf"]
# spike/ = M0 throwaway crate (design.md §7 M0): kept verbatim for
# REPORT/NOTES provenance, never part of the product build.
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

# Product profile (design.md §5.7): lto=fat + codegen-units=1 + strip.
# M0-measured effect on the equivalent dependency set: 379 -> 164.5 MiB.
# Enforced by CI size-guard (warn > 155 MiB, fail > 175 MiB).
[profile.release-prod]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
