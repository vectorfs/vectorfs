[package]
name = "vectorfs-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "vf — the vectorfs client CLI: talks to a running vectorfs daemon over signed HTTP"

# The three-crate split (design.md §0 2026-11-05 ruling): the client binary
# must stay SMALL — "服务端大一些问题不大，客户端可以小一些" (user). This
# package's whole dependency list is the guarantee: vectorfs-common (the
# shared wire core: SigV4 signer + TLS HTTP leaf + report vocabulary) plus CLI
# essentials. No engine, no protocol face, no plugin kinds. size_guard.sh
# gates this binary on its own (much lower) line.

[[bin]]
name = "vf"
path = "src/bin/vf.rs"

[dependencies]
vectorfs-common = { path = "../common", version = "0.1" }

# CLI: same derivation style as the server bin; env precedence (flag >
# VF_ENDPOINT etc.) is resolved manually in the client lib, so no clap "env".
clap = { version = "4", features = ["derive"] }
serde_json = "1"
bytes = "1"

# config.toml (2026-11-05 用户裁决: ~/.config/vectorfs/config.toml + `vf
# config init`): the third precedence layer under flag > env. Parser-only
# additions (no engine/protocol deps — the small-client guarantee holds; vf
# measured ~6 MiB against the 15 MiB size_guard line at the split, these add
# well under 1 MiB release-prod).
serde = { version = "1", features = ["derive"] }
toml = "1"
# the transport builds plain http::Request values around the shared leaf's
# client (types only — the TLS/proxy machinery stays inside common).
http = "1"
http-body-util = "0.1"
# `vf search --image` (M3-T4): the image-query wire member carries the
# container bytes as base64 (JSON has no native bytes; the /x-vf face's
# existing binary-in-string convention — nextToken). The SAME 0.22 the
# server's wire already pins — zero new subgraph, tiny; std has no base64.
base64 = "0.22"

# `vf mcp` (2026-11-06): the stdio MCP server for AGENT REMOTE mode — tool
# calls proxy to the daemon through Connection's signed HTTP, so no engine
# enters here. Same official Rust SDK and the same MINIMAL feature set the
# server's `vectorfs mcp` already validated (crates/server/Cargo.toml):
# server (tool system + schemars schema generation + async-rw transport),
# macros (#[tool]…), transport-io (stdio); defaults REPLACED to drop the
# base64-0.23 image-content feature. rmcp brings no AWS-SDK/arrow crates
# (deps_guard green server-side on the same feature set, green again here);
# measured vf release-prod went 6 -> 7.5 MiB against the 15 MiB size_guard
# line (warn 10).
rmcp = { version = "3.8", default-features = false, features = [
  "server",
  "macros",
  "transport-io",
] }

# #[tokio::main] + the shared HTTP leaf's connector + the client verbs' own
# needs: fs (put/get read/write files), time (poll timeouts/backoff),
# io-util (the MCP tests' tokio::io::duplex pairs; rmcp's transports pull
# it in too, but this package declares what IT uses).
# Declared EXPLICITLY for this package — a workspace-wide build would
# unify server's feature set in and hide an omission (the dependency list
# is the small-client guarantee; `cargo build -p vectorfs-client` must
# stand alone, which is exactly how the omission was caught).
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "fs",
  "time",
  "io-util",
] }

[dev-dependencies]
# in-process fake daemon for the signature round-trip test (same feature
# convergence as the server's axum).
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
# the decode half of the header-value round-trip test.
percent-encoding = "2"
# config.toml tests write throwaway files (dev-only — never in the binary).
tempfile = "3"
# rmcp "client" role for the in-process MCP e2e tests (duplex pair + raw
# JSON-RPC, the same harness the server's mcp.rs tests use). Test builds
# only — the shipped binary never links the client half (adds tokio-stream).
rmcp = { version = "3.8", features = ["client"] }
