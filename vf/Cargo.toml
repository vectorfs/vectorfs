[package]
name = "vectorfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Single-binary, self-hosted AWS S3 Vectors compatible gateway"
publish = false

[[bin]]
name = "vf"
path = "src/main.rs"

# Dependencies carried over from the verified M0 spike (spike/Cargo.toml,
# spike/REPORT.md 2026-11-03): same versions, same feature convergence.
# ONE deliberate deviation, recorded here: `lance` and `lance-io` are now
# `default-features = false`. Their defaults re-enable the full AWS SDK chain
# (lance-io/aws -> aws-config -> aws-sdk-sso/sts/ssooidc + opendal), which the
# M0 spike accidentally linked — violating the zero-AWS-SDK red line
# (design.md §5.7, machine-enforced by scripts/deps_guard.sh). The S3 backend
# route is unchanged: object_store's own client (aws-lc-rs crypto only).
[dependencies]
# HTTP: converged features (no default catch-all). http1 + json + tokio runtime glue only.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

# Runtime: deliberately narrow ("signal" for the SIGTERM half of graceful
# shutdown, design.md §5.1). "io-util" is used directly by the M1 T6 tests
# (tokio::io::duplex for the in-process MCP smoke); rmcp's stdio transport
# brings its own tokio/io-std + io-util features into the unified build.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "fs",
  "signal",
  "io-util",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# /tags/{resourceArn} path + query decoding (M1 T3) and list nextToken
# cursors. Both already in the lock via `url`/`lancedb` transitive copies —
# declaring them directly adds zero new crates.
percent-encoding = "2"
base64 = "0.22"

# SigV4 (hand-rolled verify, design.md §5.7: no aws-* SDK crates).
# Versions chosen to match already-locked transitive copies (zero new subgraph).
# NOTE: the spike also declared `hex` here, but nothing ever imported it
# (sigv4.rs hand-rolls its own hex encoder — the zero-dep point). Dropped in
# the product crate; caught by cargo-machete in CI.
sha2 = "0.10"
hmac = "0.12"
futures-util = { version = "0.3", default-features = false }

# CLI args. Env precedence (flag > env > vf.json > default) is resolved
# manually in config.rs, so the clap "env" feature is not needed.
clap = { version = "4", features = ["derive"] }

# Engine. Minor locked to 0.41. Default features of lancedb are empty (fs object_store only).
# DELIBERATELY NOT enabling lancedb "aws" feature: it pulls the full AWS SDK chain
# (design.md §5.7 red line, scripts/deps_guard.sh).
lancedb = "0.41"

# S3 backend WITHOUT the AWS SDK. object_store ships its own SigV4 + HTTP S3
# client (reqwest + aws-lc-rs crypto only; no aws-config chain). Version unified
# with the object_store lance already locks -> no duplicate. NOTE: "aws" feature
# hard-depends on aws-lc-rs (cmake needed to build; design.md §8 risk #11).
object_store = { version = "0.14", features = ["aws"] }

# Injection seam: lancedb 0.41 re-exports Session + ObjectStoreRegistry but NOT
# the ObjectStoreProvider trait -> direct dep on lance-io, same version lancedb
# already locks. default-features = false: lance-io defaults (aws/azure/gcp)
# pull aws-config + opendal (zero-AWS-SDK red line).
lance-io = { version = "14.0.2", default-features = false }

# NewColumnTransform (metadata schema evolution, design.md §5.3) + lance
# Result/Error types; same version already in tree via lancedb -> zero new
# crates compiled. default-features = false for the same red-line reason.
lance = { version = "14.0.2", default-features = false }

url = "2"
async-trait = "0.1"

# Credential / UUID randomness for `vf init` and the LOCK owner id
# (design.md §4.2 / §5.1). getrandom only (no rand): it is already in the
# dependency tree, so this adds zero new crates.
getrandom = "0.3"

# Local flock for the same-machine single-writer guard (design.md §5.1) and
# statvfs(2) for `vf doctor`'s free-space check (M1 T6). Same version already
# in the tree via datafusion; only the fs module is used.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

# MCP server (design.md §5.8, selected in §5.7 as "rmcp 3.x stable"): the
# official Rust MCP SDK, stdio tool server only. Feature set is the minimum:
# `server` (tool system + schemars schema generation + async-rw transport),
# `macros` (#[tool]…), `transport-io` (stdio). Default features are REPLACED:
# the default also turns on `base64` 0.23 for image content — we only emit
# text content and the tree already pins base64 0.22, so a second copy would
# be pure weight. Zero AWS-SDK / arrow crates enter via rmcp (deps_guard
# stays green; rmcp's transitive licenses are MIT/Apache-2.0 — inside the
# deny.toml allow list).
rmcp = { version = "3.8", default-features = false, features = [
  "server",
  "macros",
  "transport-io",
] }

# `vf status --endpoint` health probe (M1 T6): hyper's client through
# hyper-util. hyper-util 0.1 / http-body-util / http 1 are ALREADY transitive
# deps of axum in this tree — declaring them directly adds ZERO new crates
# (recorded for the deps_guard/deny review). http only, no TLS provider is
# linked: matches the no-outbound-network posture (§5.7 "出网: 无") — the
# probe is a user-initiated liveness check of a local daemon.
hyper-util = { version = "0.1", default-features = false, features = [
  "client",
  "client-legacy",
  "http1",
  "tokio",
] }
http-body-util = "0.1"
http = "1"

[dev-dependencies]
# tower::oneshot for in-process integration tests (no network port).
tower = { version = "0.5", features = ["util"] }
# temp data dirs for tests.
tempfile = "3"
# rmcp "client" role for the in-process MCP e2e smoke test (duplex pair +
# raw JSON-RPC, the same harness rmcp's own protocol tests use). Test builds
# only — the shipped binary never links the client half (adds tokio-stream).
rmcp = { version = "3.8", features = ["client"] }
