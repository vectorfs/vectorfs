[package]
name = "vectorfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Single-binary, self-hosted AWS S3 Vectors compatible gateway"
publish = false

# Dual thin bins (design.md §0 command ruling + 附录E.4):
# - `vectorfs`: the SERVER (init/serve/status/doctor/mcp) — links the engine
#   (lancedb) and the axum router; this is the binary size_guard.sh gates on.
# - `vf`: the CLIENT skeleton over HTTP (status --endpoint; T6 grows the
#   put/search/get/... verbs). References only the probe/render slice of the
#   lib, so the linker drops the engine/server code — it stays a small
#   binary, not a second copy of the daemon.
[[bin]]
name = "vectorfs"
path = "src/bin/vectorfs.rs"

[[bin]]
name = "vf"
path = "src/bin/vf.rs"

# Dependencies carried over from the verified M0 spike (spike/Cargo.toml,
# spike/REPORT.md 2026-11-03): same versions, same feature convergence.
# ONE deliberate deviation, recorded here: `lance` and `lance-io` are now
# `default-features = false`. Their defaults re-enable the full AWS SDK chain
# (lance-io/aws -> aws-config -> aws-sdk-sso/sts/ssooidc + opendal), which the
# M0 spike accidentally linked — violating the zero-AWS-SDK red line
# (design.md §5.7, machine-enforced by scripts/deps_guard.sh). The S3 backend
# route is unchanged: object_store's own client (aws-lc-rs crypto only).
[dependencies]
# HTTP: converged features (no default catch-all). http1 + json + tokio runtime glue only.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

# Runtime: deliberately narrow ("signal" for the SIGTERM half of graceful
# shutdown, design.md §5.1). "io-util" is used directly by the M1 T6 tests
# (tokio::io::duplex for the in-process MCP smoke); rmcp's stdio transport
# brings its own tokio/io-std + io-util features into the unified build.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "fs",
  "signal",
  "io-util",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# <data-dir>/.vectorfs/vectorfs.toml (design.md §0 config ruling, §5.3
# layout): parse + serialize the server config file. `deny_unknown_fields`
# gives the fail-fast surface (typo'd key = startup error with the TOML
# span, see config.rs). MIT/Apache-2.0 dual license; not previously in the
# tree, so zero duplicate-version risk (verified via cargo tree -d).
toml = "1"

# /tags/{resourceArn} path + query decoding (M1 T3) and list nextToken
# cursors. Both already in the lock via `url`/`lancedb` transitive copies —
# declaring them directly adds zero new crates.
percent-encoding = "2"
base64 = "0.22"

# SigV4 (hand-rolled verify, design.md §5.7: no aws-* SDK crates).
# Versions chosen to match already-locked transitive copies (zero new subgraph).
# NOTE: the spike also declared `hex` here, but nothing ever imported it
# (sigv4.rs hand-rolls its own hex encoder — the zero-dep point). Dropped in
# the product crate; caught by cargo-machete in CI.
sha2 = "0.10"
hmac = "0.12"
futures-util = { version = "0.3", default-features = false }

# CLI args. Env precedence (flag > env > vf.json > default) is resolved
# manually in config.rs, so the clap "env" feature is not needed.
clap = { version = "4", features = ["derive"] }

# Engine. Minor locked to 0.41. Default features of lancedb are empty (fs object_store only).
# DELIBERATELY NOT enabling lancedb "aws" feature: it pulls the full AWS SDK chain
# (design.md §5.7 red line, scripts/deps_guard.sh).
lancedb = "0.41"

# S3 backend WITHOUT the AWS SDK. object_store ships its own SigV4 + HTTP S3
# client (reqwest + aws-lc-rs crypto only; no aws-config chain). Version unified
# with the object_store lance already locks -> no duplicate. NOTE: "aws" feature
# hard-depends on aws-lc-rs (cmake needed to build; design.md §8 risk #11).
object_store = { version = "0.14", features = ["aws"] }

# Injection seam: lancedb 0.41 re-exports Session + ObjectStoreRegistry but NOT
# the ObjectStoreProvider trait -> direct dep on lance-io, same version lancedb
# already locks. default-features = false: lance-io defaults (aws/azure/gcp)
# pull aws-config + opendal (zero-AWS-SDK red line).
lance-io = { version = "14.0.2", default-features = false }

# NewColumnTransform (metadata schema evolution, design.md §5.3) + lance
# Result/Error types; same version already in tree via lancedb -> zero new
# crates compiled. default-features = false for the same red-line reason.
lance = { version = "14.0.2", default-features = false }

url = "2"
async-trait = "0.1"

# Credential / UUID randomness for `vf init` and the LOCK owner id
# (design.md §4.2 / §5.1). getrandom only (no rand): it is already in the
# dependency tree, so this adds zero new crates.
getrandom = "0.3"

# Local flock for the same-machine single-writer guard (design.md §5.1) and
# statvfs(2) for `vf doctor`'s free-space check (M1 T6). Same version already
# in the tree via datafusion; only the fs module is used.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

# MCP server (design.md §5.8, selected in §5.7 as "rmcp 3.x stable"): the
# official Rust MCP SDK, stdio tool server only. Feature set is the minimum:
# `server` (tool system + schemars schema generation + async-rw transport),
# `macros` (#[tool]…), `transport-io` (stdio). Default features are REPLACED:
# the default also turns on `base64` 0.23 for image content — we only emit
# text content and the tree already pins base64 0.22, so a second copy would
# be pure weight. Zero AWS-SDK / arrow crates enter via rmcp (deps_guard
# stays green; rmcp's transitive licenses are MIT/Apache-2.0 — inside the
# deny.toml allow list).
rmcp = { version = "3.8", default-features = false, features = [
  "server",
  "macros",
  "transport-io",
] }

# gzip normalize transform (M2.1 step 3, pipeline/normalize.rs): flate2
# v1.1.10 is ALREADY compiled into this exact build as a transitive dep of
# the lance -> reqwest -> tower-http -> async-compression chain, locked
# there with the default rust_backend (miniz_oxide, pure Rust). Declaring
# it directly therefore adds ZERO new crates to the graph and ZERO new
# lockfile versions (same discipline as percent-encoding/sha2/rustix
# above). default-features = false + rust_backend spells out the exact
# feature set the tree already unifies on — no zlib C backend can enter
# through feature drift. MIT OR Apache-2.0.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# `vf status --endpoint` health probe (M1 T6): hyper's client through
# hyper-util. hyper-util 0.1 / http-body-util / http 1 are ALREADY transitive
# deps of axum in this tree — declaring them directly adds ZERO new crates
# (recorded for the deps_guard/deny review). http only, no TLS provider is
# linked: matches the no-outbound-network posture (§5.7 "出网: 无") — the
# probe is a user-initiated liveness check of a local daemon.
hyper-util = { version = "0.1", default-features = false, features = [
  "client",
  "client-legacy",
  # client-proxy: the CONNECT `Tunnel` connector (model prefetch / openai
  # egress through corporate proxies — standard *_PROXY env semantics, see
  # pipeline/embed/http.rs). A feature of an existing dep: zero new crates.
  "client-proxy",
  "http1",
  "tokio",
] }
http-body-util = "0.1"
http = "1"
# tower-service trait ONLY (implementing the proxy-aware transport connector
# in pipeline/embed/http.rs — hyper-util's legacy client takes any
# tower Service<Uri> as its connector). Same version already locked via
# hyper-util: declaring it directly adds zero new crates.
tower-service = "0.3"

# ---- M2 T4 pipeline kinds (design.md §5.7 "文件层" row, §5.10.2 kind table) ----

# pdf-text extractor: high-level pdfium bindings, DYNAMIC loading only.
# default-features = false drops the default [pdfium_latest, image_latest,
# thread_safe] set: image_latest would drag `image` 0.25 in (M3 pdf-pages
# territory, dead weight today). Kept features:
#   - thread_safe: pdfium is not thread-safe; this wraps every FFI call in a
#     mutex so the Extractor (Send + Sync by trait) is sound across the
#     spawn_blocking ingest pool (§5.10.5). The `static` feature is NOT set —
#     dynamic .so binding is the §5.7 ruling.
#   - pdfium_7881: newest bindings gate at-or-below our pinned binary
#     (bblanchon/pdfium-binaries chromium/8066 via scripts/fetch_runtime_libs.sh);
#     using pdfium_latest (= 8125) could bind symbols the 8066 .so lacks.
# MIT OR Apache-2.0; pdfium itself is BSD-3 / Apache-2.0 (allowed binary dep).
pdfium-render = { version = "0.9", default-features = false, features = [
  "thread_safe",
  "pdfium_7881",
] }

# pdf-inspector extractor: lopdf-based pure-Rust PDF detection/classification
# + text/markdown extraction (firecrawl). Default feature set is EMPTY (see
# the crate's [features] table) — the crate is a plain library with zero
# optional heavy deps in this configuration; the optional features
# (ocr/render-pdfium/ocr-oar pulling ort + oar-ocr + image, model-download
# pulling ureq, python pulling pyo3) are all EXPLICITLY NOT enabled: they
# would violate the §5.7 posture (no second ort copy, no network stack, no
# python linkage). Runtime deps it does bring (lopdf 0.45 + regex/
# ttf-parser/unicode-*) are all pure Rust — the kind therefore needs NO .so,
# unlike pdf-text (pdfium): that zero-native-library property is the ops
# differentiation of the kind. MIT.
pdf-inspector = "1.25"

# md extractor: CommonMark pull parser. default-features = false drops the
# `html` push renderer and `getopts` (binary-only) — we consume the event
# stream directly, so both are dead weight. MIT.
pulldown-cmark = { version = "0.13", default-features = false }

# token-window chunker: semantic text splitting with CHARACTER counting (the
# §5.7 line: "text-splitter char 计数, 禁 tiktoken 联网特性"). text-splitter
# 0.33 has NO default features — the tokenizers/tiktoken-rs/code/markdown
# features are all opt-in and all stay OFF, so nothing model-shaped or
# network-capable enters the tree. We consume its semantic split points and
# enforce the exact char-overlap window invariant locally (token_window.rs
# has the rationale). MIT.
text-splitter = { version = "0.33", default-features = false }

# ---- M2 T5 embedder kinds (design.md §5.7 "文件层" row, §5.10.2 Embedder) ----

# ort embedder: ONNX Runtime bindings, DYNAMIC loading only (the §5.7 ruling:
# "ort (.so load-dynamic, 不引 fastembed)"). default-features = false drops
# the default [std, ndarray, tracing, download-binaries, tls-native,
# fetch-models, ...] set: download-binaries/fetch-models would fetch a
# prebuilt ORT at BUILD time (we pin + sha the .so ourselves via
# scripts/fetch_runtime_libs.sh, §5.10.7), ndarray/tacing/half/... are unused
# weight. Kept features:
#   - load-dynamic: link nothing at build time; dlopen libonnxruntime.so at
#     runtime (ort::init_from / ORT_DYLIB_PATH; resolved through our
#     VF_ORT_PATH > runtime-libs/ > system chain in embed/ort.rs).
# Version is pinned EXACT (`=`): pre-2.0 rcs break API between releases, and
# ort-sys 2.0.0-rc.15 pairs with ONNX Runtime 1.31.0 (its bundled dist.tsv)
# — which is exactly the version fetch_runtime_libs.sh pins.
# MIT OR Apache-2.0; onnxruntime itself is MIT (allowed binary dep).
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "load-dynamic",
] }

# ort embedder tokenizer: the HF `tokenizers` runtime (tokenizer.json — the
# same file every HF ONNX export ships). default-features = false drops
# onig (C oniguruma regex backend), esaxx_fast (C++ suffix arrays — Unigram
# TRAINING only, never inference) and progressbar (indicatif). fancy-regex
# (pure Rust) is kept because tokenizer.json `Replace` normalizers require
# a regex backend (compile_error! without one) and C regex engines are
# exactly what a minimal-footprint binary must not grow. Apache-2.0.
tokenizers = { version = "0.23", default-features = false, features = [
  "fancy-regex",
] }

# openai embedder TLS: rustls 0.23 + hyper-rustls are ALREADY transitive
# deps in this tree (object_store/reqwest/lance chain, unified version
# 0.23.x) — declaring them directly adds ZERO new crates beyond
# webpki-roots. Provider = aws-lc-rs (the crypto object_store already
# binds, design.md §8 #11; NOT ring). The openai kind is hand-rolled HTTP
# over hyper-util (§5.7 "自研 HTTP 复用 hyper 树 ~150 行, 零 reqwest") — these
# are its TLS plumbing only. Features are the minimum: http1, tls12, the
# aws-lc-rs provider, and webpki-roots for the root store.
#   - hyper-rustls / rustls: MIT OR Apache-2.0; aws-lc-rs: ISC + OpenSSL
#     (already accepted in deny.toml).
#   - webpki-roots: MPL-2.0 — accepted per the M1 ruling recorded in
#     deny.toml (consumed as a data library; file-level weak copyleft, not
#     viral). It bundles the Mozilla root set so the binary works on
#     slim containers without /etc/ssl/certs; the alternative
#     (rustls-native-certs) depends on the host cert store, which is
#     exactly the failure mode a self-contained binary must avoid.
#   - rustls is declared DIRECTLY (same 0.23.x the tree already locks, zero
#     new crates) because the tree's rustls has BOTH provider features
#     enabled (hyper-rustls/aws-lc-rs via object_store AND ring via
#     reqwest's feature unification) — rustls's default provider selection
#     PANICS on that ambiguity, so embed/http.rs must name the provider
#     explicitly (aws-lc-rs, the object_store-blessed crypto).
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "tls12",
  "aws-lc-rs",
  "webpki-tokio",
] }
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "tls12",
  "aws-lc-rs",
] }

[dev-dependencies]
# tower::oneshot for in-process integration tests (no network port).
tower = { version = "0.5", features = ["util"] }
# temp data dirs for tests.
tempfile = "3"
# rmcp "client" role for the in-process MCP e2e smoke test (duplex pair +
# raw JSON-RPC, the same harness rmcp's own protocol tests use). Test builds
# only — the shipped binary never links the client half (adds tokio-stream).
rmcp = { version = "3.8", features = ["client"] }
