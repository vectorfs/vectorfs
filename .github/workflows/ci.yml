# CI skeleton (M1 Task 1; conformance job added in M1 Task 7). Four jobs, all
# commands verified locally first:
#   build-test  — cargo fmt --check / cargo build / cargo test
#   deps-guard  — scripts/deps_guard.sh (zero AWS SDK + unified arrow/lance),
#                 cargo-machete (unused deps), cargo-deny (licenses/bans;
#                 advisories warn-only)
#   size-guard  — release-prod build + binary size gate (warn >155MiB,
#                 fail >175MiB, design.md §5.7)
#   conformance — 32-step wire matrix through BOTH first-party SDKs (boto3 +
#                 aws-sdk-go-v2) against a freshly `vectorfs init`'d
#                 file-backend daemon (M1 Task 7; steps 1:1 with
#                 conformance/boto3_check.py)
#
# NOTE: aws-lc-sys (via object_store "aws") needs cmake + a C toolchain — both
# preinstalled on ubuntu-latest runners (design.md §8 risk #11).
# NOTE: lance-encoding's build script needs protoc (prost) — NOT preinstalled on
# GitHub runners; each compiling job apt-installs protobuf-compiler.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: fmt + build + test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: install protoc (lance-encoding build dep)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # same key as the conformance job — share the debug-build cache
          # instead of recompiling the dependency tree twice per run
          shared-key: debug-workspace

      # M1 T6 leftover TODO closed: bake the short commit sha into the binary
      # (report.rs option_env!("VF_GIT_HASH")) so `vectorfs --version` and
      # /healthz report it; the conformance job asserts healthz.version.
      # Per-commit value changes recompile only the leaf crate.
      - name: export VF_GIT_HASH (short sha)
        run: echo "VF_GIT_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # M2 T4: pinned pdfium .so for the pdf-text extractor tests. The cache
      # key embeds the SAME pin as scripts/fetch_runtime_libs.sh (chromium/
      # 8066) — bump both together or the cache serves a stale library (the
      # script's stamp check would then re-download, so it self-heals).
      - name: fetch pinned runtime libs (pdfium)
        run: ./scripts/fetch_runtime_libs.sh pdfium
      - uses: actions/cache@v4
        with:
          path: runtime-libs
          key: runtime-libs-${{ runner.os }}-${{ runner.arch }}-pdfium-chromium-8066

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  deps-guard:
    name: dependency guard (no aws sdk / single arrow / licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # a) zero-AWS-SDK red line + arrow/lance version unification
      - name: deps_guard.sh
        run: ./scripts/deps_guard.sh

      # b) unused-dependency detection (runs on the product workspace; spike/
      #    is a frozen throwaway crate and intentionally not machete'd — hence
      #    the explicit path argument)
      - name: cargo-machete
        uses: bnjbvr/cargo-machete@v0.9.2
        with:
          args: vf

      # c) license whitelist + bans (deny.toml). Advisory classes that
      #    cargo-deny can downgrade are warn/non-fatal in deny.toml;
      #    actual vulnerabilities still gate (see deny.toml header).
      #    NOTE arg-order trap (cost two red CI runs): this action assembles
      #    `cargo-deny <arguments> <command> <command-arguments>` — check
      #    names belong in command-arguments, NOT arguments.
      - name: cargo-deny (licenses / bans / advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: licenses bans advisories

  size-guard:
    name: release-prod binary size (warn >155MiB / fail >175MiB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: install protoc (lance-encoding build dep)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # dedicated key: release-prod artifacts differ from the debug
          # builds of build-test/conformance — sharing would thrash.
          # Warm rebuilds keep this job short enough to survive the
          # observed ~30min hosted-runner reclaim window (4 kills in a
          # row on this, the only >25min job).
          shared-key: release-prod-workspace

      - name: cargo build --profile release-prod
        run: cargo build --profile release-prod --workspace

      - name: size check
        run: ./scripts/size_guard.sh

  # M1 Task 7: full-matrix conformance — the SAME 32 steps boto3 and the Go
  # SDK drive (conformance/boto3_check.py / conformance/go/main.go, step
  # numbers+names 1:1). file backend on a fresh data dir (closest to real
  # deployments); the daemon is started in-process, healthz-gated, and
  # stopped by a trap; server stderr is dumped on failure.
  conformance:
    name: conformance (boto3 + go, 32 steps each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: conformance/go/go.mod
          cache-dependency-path: conformance/go/go.sum

      - name: install protoc (lance-encoding build dep)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # same key as the build-test job — reuse its compiled dependency
          # tree; only the leaf crate differs (VF_GIT_HASH below)
          shared-key: debug-workspace

      - name: export VF_GIT_HASH (short sha)
        run: echo "VF_GIT_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: pip install boto3
        run: pip install boto3

      - name: cargo build (debug)
        run: cargo build --workspace

      - name: vectorfs init + serve + conformance (boto3 then go)
        run: |
          set -euo pipefail
          ./target/debug/vectorfs init --data-dir ./ci-data
          AK=$(python3 -c "import tomllib; print(tomllib.load(open('ci-data/.vectorfs/vectorfs.toml','rb'))['access_key_id'])")
          SK=$(python3 -c "import tomllib; print(tomllib.load(open('ci-data/.vectorfs/vectorfs.toml','rb'))['secret_access_key'])")
          nohup ./target/debug/vectorfs serve --data-dir ./ci-data --port 8787 >server.log 2>&1 &
          VF_PID=$!
          trap 'kill "$VF_PID" 2>/dev/null || true' EXIT

          # healthz poll (SigV4-exempt route) before pointing clients at it
          ready=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/healthz >healthz.json; then ready=1; break; fi
            sleep 1
          done
          test -n "$ready" || { echo "server never became healthy"; exit 1; }

          # healthz.version must be non-empty AND carry the baked commit
          # (VF_GIT_HASH wiring; "commit unknown" means the build missed it)
          VER=$(python3 -c "import json; print(json.load(open('healthz.json'))['version'])")
          test -n "$VER" || { echo "healthz.version is empty"; exit 1; }
          case "$VER" in *"commit unknown"*) echo "healthz.version lacks the commit: $VER"; exit 1;; esac
          echo "healthz ok: $VER"

          python3 conformance/boto3_check.py \
            --endpoint http://127.0.0.1:8787 \
            --access-key "$AK" --secret-key "$SK"
          (cd conformance/go && go run . \
            --endpoint http://127.0.0.1:8787 \
            --access-key "$AK" --secret-key "$SK")

      - name: dump server stderr tail (last 50 lines, on failure)
        if: failure()
        run: tail -50 server.log

  # Enabled 2026-11-04: repository turned public — arm64 and macOS hosted
  # runners are free for public repos (design.md §5.7 "Linux x64+arm64 首发,
  # macOS CI 绿灯"). protoc is installed like everywhere else (lance-encoding
  # build dep); cmake for aws-lc-sys is preinstalled on all three images.
  build-test-arm:
    name: fmt + build + test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install protoc (lance-encoding build dep)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@v2
      # same pinned-pdfium rationale as build-test: the arm job also runs the
      # pdf tests, and they refuse to skip without the real .so (M2 T4)
      - name: fetch pinned runtime libs (pdfium, arm64)
        run: ./scripts/fetch_runtime_libs.sh pdfium
      - uses: actions/cache@v4
        with:
          path: runtime-libs
          key: runtime-libs-${{ runner.os }}-${{ runner.arch }}-pdfium-chromium-8066
      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  size-guard-arm:
    name: release-prod size (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install protoc (lance-encoding build dep)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-prod-workspace
      - run: cargo build --profile release-prod --workspace
      - run: ./scripts/size_guard.sh

  build-test-macos:
    name: fmt + build + test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install protoc (lance-encoding build dep)
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
      # same pinned-pdfium rationale as build-test (macOS arm64 asset;
      # runtime-libs/libpdfium.dylib)
      - name: fetch pinned runtime libs (pdfium, mac)
        run: ./scripts/fetch_runtime_libs.sh pdfium
      - uses: actions/cache@v4
        with:
          path: runtime-libs
          key: runtime-libs-${{ runner.os }}-${{ runner.arch }}-pdfium-chromium-8066
      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
