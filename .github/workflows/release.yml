# Release pipeline (M1 Task 8). Trigger: `git tag v0.1.0 && git push --tags`
# (workflow_dispatch as the manual fallback; it derives the version from
# Cargo.toml instead of the tag).
#
# Jobs:
#   release (matrix)   — release-prod builds for x86_64 (native) and
#                        aarch64 (cross-rs in Docker), VF_GIT_HASH baked in;
#                        size_guard.sh runs PER TARGET on the parameterized
#                        `vectorfs` binary path (the big server bin; the thin
#                        `vf` client is printed but not gated); artifacts
#                        vectorfs-<version>-<target>.tar.gz (both binaries +
#                        README copy) uploaded per target.
#   smoke-ubuntu-20-04 — unpacks the x86_64 tarball inside `docker run
#                        ubuntu:20.04`, `vectorfs init && vectorfs serve`,
#                        apt-installs python3+boto3 and drives a 5-step
#                        roundtrip (create/put/query/get/delete+cleanup).
#                        This is the glibc-compatibility gate for the release
#                        binary.
#   publish            — needs BOTH green: merges artifacts, writes
#                        sha256sums.txt, attaches everything via
#                        softprops/action-gh-release.
#
# ---------------------------------------------------------------------------
# FIRST-VERIFICATION LIST (cannot be exercised without a real tag push /
# hosted runners; everything else was verified locally where the toolchain
# allows — see the M1 Task 8 notes):
#   1. cross-rs aarch64 build: Cross.toml (env passthrough + pre-build apt of
#      cmake/protoc inside the container) is configuration, not yet run.
#   2. glibc: the x86_64 binary is linked on ubuntu-latest (24.04). If the
#      20.04 smoke job fails with versioned-symbol errors, the fix is to
#      build x86_64 inside an ubuntu:20.04 container as well (or zigbuild).
#   3. aws-lc-rs CPU baseline: aws-lc-rs may emit newer-CPU instructions than
#      20.04-era hosts have; if the smoke job dies with "illegal instruction",
#      record it and pin the baseline explicitly (this is the design.md §5.7
#      "glibc/CPU baseline: measure, then pin" checkpoint).
#   4. cargo install cross --locked (crates.io 0.2.5) compiling on the
#      current stable Rust.
#   5. ubuntu:20.04 ships Python 3.8: pip must resolve to a boto3 that both
#      supports 3.8 and carries the s3vectors client (added ~1.39, mid-2025).
#      If the resolver lands below that, pin boto3 to the newest 3.8-capable
#      release with s3vectors in the pip3 line below.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # softprops/action-gh-release creates the release

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build ${{ matrix.target }} (release-prod + size guard)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # 2026-11-05 M2 finding: building natively on ubuntu-latest (24.04,
            # glibc 2.39) let M2's new deps (rustls/aws-lc/ort/tokenizers) pick
            # up GLIBC_2.33/2.34/2.38 symbol versions — the tarball then dies in
            # the ubuntu:20.04 smoke with "GLIBC_2.38 not found" (M1 passed only
            # because its binary happened not to reference the newer symbols).
            # Building inside rust:1-bullseye (debian 11, glibc 2.31 = the smoke
            # baseline) pins the ABI floor the same way Cross.toml's 20.04 base
            # already does for aarch64.
            build-in-container: rust:1-bullseye
          - target: aarch64-unknown-linux-gnu
            build-in-container: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Pinned protoc staged into the WORKSPACE (.tools/protoc) so every
      # build container sees it at a known mount-relative path via the
      # PROTOC env var (prost-build's documented sourcing knob): the
      # bullseye container mounts /ws, cross mounts /project — apt inside
      # those is NOT an option (the bullseye run is unprivileged; cross's
      # ubuntu-20.04 apt only has protoc 3.6, which rejects
      # --experimental_allow_proto3_optional that lance-encoding passes —
      # flag support is 3.12..3.21; v21.12 is the bookworm version the
      # Docker workflow's amd64 build already compiled green with).
      - name: stage pinned protoc (21.12)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          mkdir -p .tools/protoc
          unzip -qo /tmp/protoc.zip -d .tools/protoc
          .tools/protoc/bin/protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-prod-${{ matrix.target }}

      - name: export VF_GIT_HASH (short sha)
        run: echo "VF_GIT_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: resolve version (tag v<x> or Cargo.toml fallback)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version: $VERSION"

      - name: build (release-prod; cross-rs for aarch64, glibc-2.31 container for x86_64)
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.build-in-container }}" ]]; then
            # unprivileged (--user): the workspace's target/ stays runner-
            # owned, so rust-cache and the package step below keep working.
            # protoc rides the workspace mount — no apt, no root (the
            # 2026-11-05 v0.1.0 first-tag run proved apt is impossible here:
            # unprivileged apt-get dies on /var/lib/apt/lists, and its
            # failure was swallowed by an `a && b;` list's set -e
            # exemption, surfacing only later as prost's "Could not find
            # protoc").
            docker run --rm --user "$(id -u):$(id -g)" \
              -e VF_GIT_HASH -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
              -e PROTOC=/ws/.tools/protoc/bin/protoc \
              -v "$PWD:/ws" -w /ws \
              "${{ matrix.build-in-container }}" \
              bash -c 'set -euo pipefail;
                       cargo build --profile release-prod --workspace --target ${{ matrix.target }}'
          else
            cargo install cross --locked
            # PROTOC points at cross's own mount of the workspace (/project);
            # Cross.toml's passthrough carries it into the container.
            PROTOC=/project/.tools/protoc/bin/protoc \
              cross build --profile release-prod --workspace --target "${{ matrix.target }}"
          fi

      # size_guard.sh takes the binary path as $1 (default
      # target/release-prod/vectorfs). The gate covers the SERVER binary;
      # the thin `vf` client is orders of magnitude smaller — printed for
      # the log, not gated.
      - name: size guard (per target)
        run: |
          ./scripts/size_guard.sh "target/${{ matrix.target }}/release-prod/vectorfs"
          ls -la "target/${{ matrix.target }}/release-prod/vf" \
            || echo "WARN: client bin vf missing"

      - name: package (both binaries + README copy)
        run: |
          set -euo pipefail
          mkdir -p package
          cp "target/${{ matrix.target }}/release-prod/vectorfs" package/vectorfs
          cp "target/${{ matrix.target }}/release-prod/vf" package/vf
          cp README.md package/
          tar -czf "vectorfs-${VERSION}-${{ matrix.target }}.tar.gz" -C package vectorfs vf README.md
          ls -la "vectorfs-${VERSION}-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: vectorfs-${{ matrix.target }}
          path: vectorfs-*.tar.gz
          if-no-files-found: error

  smoke-ubuntu-20-04:
    name: ubuntu:20.04 smoke (glibc gate, 5-step SDK roundtrip)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vectorfs-x86_64-unknown-linux-gnu

      # Split smoke (2026-11-05 rework, after both halves failed a LOCAL
      # dry-run of the never-yet-triggered job):
      #   inside the container (glibc gate): vectorfs init/serve + healthz
      #     poll + `vf status` — both release binaries exercising 20.04-era
      #     glibc end to end;
      #   on the host (SDK gate): the 5-step boto3 roundtrip against the
      #     container's published port — 20.04's python3.8 cannot pip-resolve
      #     a boto3 that knows `s3vectors` (botocore added the service after
      #     dropping py3.8), so the SDK half MUST run from a newer python.
      - name: docker run ubuntu:20.04 smoke
        run: |
          set -euo pipefail
          mkdir -p dist && tar -xzf vectorfs-*-x86_64-unknown-linux-gnu.tar.gz -C dist
          cat > dist/smoke_check.py <<'PYEOF'
          import argparse, sys, urllib.request
          import boto3

          p = argparse.ArgumentParser()
          p.add_argument("--endpoint", required=True)
          p.add_argument("--access-key", required=True)
          p.add_argument("--secret-key", required=True)
          a = p.parse_args()
          c = boto3.client("s3vectors", endpoint_url=a.endpoint,
                           aws_access_key_id=a.access_key,
                           aws_secret_access_key=a.secret_key,
                           region_name="us-east-1")
          b, i = "smoke-bucket", "smoke-index"
          c.create_vector_bucket(vectorBucketName=b)                        # 1 create
          c.create_index(vectorBucketName=b, indexName=i, dataType="float32",
                        dimension=3, distanceMetric="cosine")
          c.put_vectors(vectorBucketName=b, indexName=i, vectors=[           # 2 put
              {"key": "k1", "data": {"float32": [1.0, 0.0, 0.0]}},
              {"key": "k2", "data": {"float32": [0.0, 1.0, 0.0]}}])
          q = c.query_vectors(vectorBucketName=b, indexName=i,               # 3 query
                              queryVector={"float32": [1.0, 0.0, 0.0]},
                              topK=2, returnDistance=True)["vectors"]
          assert q[0]["key"] == "k1" and q[0]["distance"] < 1e-6, q
          g = c.get_vectors(vectorBucketName=b, indexName=i,                 # 4 get
                            keys=["k1", "k2"])["vectors"]
          assert sorted(v["key"] for v in g) == ["k1", "k2"], g
          c.delete_index(vectorBucketName=b, indexName=i)                    # 5 delete
          c.delete_vector_bucket(vectorBucketName=b)
          print("smoke: 5 steps PASS")
          PYEOF
          # container half: healthz poll via stdlib (curl not assumed), then
          # serve for the host half. Credentials land in the mounted dist/
          # dir for the host to read.
          # VF_LISTEN=0.0.0.0: serve must bind the container's eth0 for the
          # published port (the -p forward) to reach it — the default
          # 127.0.0.1 bind resets host connections.
          docker run -d --rm --name vf-smoke -p 127.0.0.1:18787:8787 \
            -e VF_LISTEN=0.0.0.0 \
            -v "$PWD:/work" -w /work/dist ubuntu:20.04 bash -euo pipefail -c '
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null
            ./vectorfs init --data-dir /tmp/vfdata
            ./vectorfs serve --data-dir /tmp/vfdata >/tmp/vf.log 2>&1 &
            VF_PID=$!
            for i in $(seq 1 30); do
              python3 -c "import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8787/healthz\",timeout=1)" \
                && break || sleep 1
            done
            ./vf status --endpoint http://127.0.0.1:8787
            cp /tmp/vfdata/.vectorfs/vectorfs.toml ./smoke-creds.toml
            tail -5 /tmp/vf.log
            wait $VF_PID
          '
          trap 'docker kill vf-smoke >/dev/null 2>&1 || true' EXIT
          sleep 2
          AK=$(awk -F"\"" "/^access_key_id/{print \$2}" dist/smoke-creds.toml)
          SK=$(awk -F"\"" "/^secret_access_key/{print \$2}" dist/smoke-creds.toml)
          pip install --quiet --user boto3
          python3 dist/smoke_check.py --endpoint http://127.0.0.1:18787 \
            --access-key "$AK" --secret-key "$SK"
          docker kill vf-smoke

  publish:
    name: attach artifacts + sha256sums to the release
    needs: [release, smoke-ubuntu-20-04]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-out
          merge-multiple: true

      - name: sha256sums.txt
        run: |
          set -euo pipefail
          cd dist-out
          ls -la
          sha256sum vectorfs-*.tar.gz > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-out/vectorfs-*.tar.gz
            dist-out/sha256sums.txt
          generate_release_notes: true
