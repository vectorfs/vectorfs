# deploy/docker-compose.yml — one-command vectorfs deployment (M2-T8,
# design.md §5.10.7). Volumes keep data and models OUT of the image layer;
# scalar overrides ride VF_* env (endpoint/credentials/preset/backend —
# complex structure belongs in the volume's vectorfs.toml, §5.10.7 boundary).
#
# ONE DAEMON PER BUCKET SET (v3: lock granularity = BUCKET, design.md §5.1 /
# design-v3.md §5.1 — every system bucket X-vf carries its own LOCK object).
# A single daemon managing every bucket remains the DEFAULT deployment form —
# do NOT scale this service over the same bucket set (`--scale vectorfs=2`
# fights the per-bucket LOCKs). Multiple daemons may share one S3 endpoint
# only over DISJOINT bucket sets; a pure protocol-face fan-out in front of
# the same buckets needs external bucket-aware routing.
#
# K8s: run the image with the same volumes/env; no chart by design.
#
# First boot: set VF_PRESET (below) to materialize vectorfs.toml into the
# data volume on the first start (text-rag downloads the ~1.17 GiB gte model
# into the models volume at that moment; air-gapped expects you to mount the
# model directory yourself). Leave it unset to manage vectorfs.toml by hand.

services:
  vectorfs:
    # Local image from scripts/docker_build.sh (built as vectorfs:local).
    # CI publishes ghcr.io/vectorfs/vectorfs:version + :latest on v* tags —
    # once a tag is pushed, switch to the ghcr image.
    image: vectorfs:local
    ports:
      - "8787:8787"
    volumes:
      - data:/vectorfs/data
      - models:/vectorfs/models
    environment:
      # --- first-boot materialization (uncomment ONE) -----------------------
      # - VF_PRESET=dev          # pure protocol face, no models
      # - VF_PRESET=text-rag     # downloads gte on first boot (~1.17 GiB)
      # - VF_PRESET=air-gapped   # no download; mount the model under models/
      # --- scalar overrides (flag > VF_* env > vectorfs.toml > default) -----
      # - VF_PORT=8787
      # - VF_BACKEND=s3+http://minio:9000   # s3 backend, ENDPOINT form (no bucket
      #                                      # path — v3 fail-fasts on one): each vector
      #                                      # bucket X is the pair X (source) + X-vf
      #                                      # (system), created on the endpoint
      # - VF_ACCESS_KEY=…        # client-facing SigV4 creds override
      # - VF_SECRET_KEY=…
      # - VF_S3_ACCESS_KEY=…     # backend S3 connection creds
      # - VF_S3_SECRET_KEY=…
      - VF_PRESET=${VF_PRESET:-}
      # Proxy passthrough (mainland): compose does NOT inherit shell env into
      # containers — only ${...} interpolation, so an `HTTPS_PROXY=… docker
      # compose up` needs these lines to reach the daemon (its connector
      # tunnels via CONNECT; empty values are filtered to direct). NO_PROXY
      # default keeps the healthcheck's 127.0.0.1 probe — and any internal
      # VF_BACKEND S3 host — off the proxy; extend it, don't remove it.
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
    restart: unless-stopped
    # mirrors the image's built-in healthcheck (vf probes GET /health —
    # credential-less by design, §5.10.7)
    healthcheck:
      test: ["CMD-SHELL", "vf status --endpoint http://127.0.0.1:${VF_PORT:-8787} >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Emulator variant (CI / testcontainers / local SDK testing): volatile
  # memory backend, no auth, no volumes — `docker compose --profile emulator
  # up vectorfs-emulator` (then point boto3 at http://127.0.0.1:8788 with any
  # static credentials). The explicit `serve …` command bypasses first-boot
  # init entirely (entrypoint contract).
  vectorfs-emulator:
    image: vectorfs:local
    command: serve --backend memory --no-auth
    ports:
      - "8788:8787"
    profiles: ["emulator"]
    restart: unless-stopped

volumes:
  data:
  models:
