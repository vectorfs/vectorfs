[package]
name = "vf-spike"
version = "0.0.0"
edition = "2021"
publish = false
# M0 throwaway spike crate. Quality bar: builds & is measurable. Not product code.

[[bin]]
name = "vf-spike"
path = "src/main.rs"

[dependencies]
# HTTP: converged features (no default catch-all). http1 + json + tokio runtime glue only.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

# Runtime: deliberately narrow.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# SigV4 (hand-rolled verify, design.md §5.7: no aws-* SDK crates).
# Versions chosen to match already-locked transitive copies (zero new subgraph).
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
futures-util = { version = "0.3", default-features = false }

# CLI args (env override needs clap "env" feature).
clap = { version = "4", features = ["derive", "env"] }

# Engine. Minor locked to 0.41. Default features of lancedb are empty (fs object_store only).
# DELIBERATELY NOT enabling lancedb "aws" feature: lance-io/aws pulls the full AWS SDK chain
# (aws-config -> aws-sdk-sso/sts/ssooidc -> ~22 aws-* crates + opendal). Server target is zero
# AWS SDK. Task D (MinIO) options + evidence: see NOTES.md 依赖核查.
lancedb = "0.41"

# Task D: S3 backend WITHOUT the AWS SDK. object_store ships its own SigV4 + HTTP S3 client
# (reqwest + aws-lc-rs crypto only; no aws-config chain). Version unified with the object_store
# lance already locks (0.14.2) -> no duplicate. NOTE: "aws" feature hard-depends on aws-lc-rs
# (cmake needed to build); size cost recorded in NOTES/REPORT.
object_store = { version = "0.14", features = ["aws"] }

# Injection seam: lancedb 0.41 re-exports Session + ObjectStoreRegistry but NOT the
# ObjectStoreProvider trait -> direct dep on lance-io, same version lancedb already locks.
lance-io = "14.0.2"

# Direct lance dep only to name NewColumnTransform (Q10 schema-evolution experiment);
# same version already in tree via lancedb -> zero new crates compiled.
lance = "14.0.2"

url = "2"
async-trait = "0.1"

# Hard rule: no aws-config / aws-sdk-* crates as dependencies of this server.
# (SigV4 verification is hand-rolled in src/sigv4.rs; S3 client = object_store self-signed.)

[dev-dependencies]
# tower::oneshot for in-process integration tests (no network port).
tower = { version = "0.5", features = ["util"] }
# temp data dirs for tests.
tempfile = "3"

[profile.release]
# spike: keep cargo defaults; recorded in NOTES.md for size-budget comparison.
# (product later: lto=fat / codegen-units=1 / strip — design.md §5.7)

# Task D size adjudication: product-grade profile per design §5.7 (NOT used by cargo test).
[profile.release-prod]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
